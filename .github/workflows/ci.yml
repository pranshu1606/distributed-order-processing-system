name: Build and Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: "6379"

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inventory_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d inventory_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            inventory-service/pom.xml
            order-service/pom.xml

      - name: Create order database
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            psql -U postgres -d inventory_db \
            -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE order_db;"

      - name: Test Inventory Service
        working-directory: inventory-service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/inventory_db
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Test Order Service
        working-directory: order-service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/order_db
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Validate and build portable Compose stack
        run: |
          docker compose config --quiet
          docker compose build

      - name: Verify healthy startup
        run: |
          docker compose up -d --no-build --wait --wait-timeout 180
          curl --fail http://localhost:8081/actuator/health
          curl --fail http://localhost:8080/actuator/health

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100

      - name: Stop demo containers
        if: always()
        run: docker compose down
