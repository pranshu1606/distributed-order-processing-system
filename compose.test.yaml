# Separate, disposable infrastructure: never mounts the laptop database volume.
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory_db
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_db"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  tests:
    image: maven:3.9-eclipse-temurin-17
    mem_limit: 1g
    working_dir: /workspace
    volumes:
      - .:/workspace
      - test-maven-cache:/root/.m2
    environment:
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      REDIS_HOST: redis
      SPRING_DATA_REDIS_HOST: redis
      JAVA_TOOL_OPTIONS: -Xmx256m -XX:ActiveProcessorCount=2 -XX:+UseG1GC
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/inventory_db
        mvn -B -f inventory-service/pom.xml verify &&
        SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/order_db
        mvn -B -f order-service/pom.xml verify

volumes:
  test-maven-cache: {}
